# ==============================================================================
# Google Cloud Run Service Specification — Smart Health Sentinel (MediFlow)
# ==============================================================================
# Apply with: gcloud run services replace cloudrun-service.yaml --region <REGION>
# ==============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sentinel-backend
  labels:
    cloud.google.com/location: us-central1
    app: smart-health-sentinel
    environment: staging
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: sentinel-backend-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/sentinel-backend:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Operational configuration (no secrets in plain text)
            - name: DEBUG
              value: "false"
            - name: APP_NAME
              value: "Healthcare Supply Chain API"
            - name: APP_VERSION
              value: "0.1.0"
            - name: CORS_ORIGINS
              value: "https://smart-health-gray-theta.vercel.app,https://smarthealth-production.up.railway.app"
            - name: PLANNING_HORIZON_DAYS
              value: "30"
            - name: SAFETY_RESERVE_DAYS
              value: "7"
            - name: GEMINI_MODEL
              value: "gemini-1.5-flash"
            - name: GEMINI_TIMEOUT_SECONDS
              value: "3.0"

            # Secret bindings from Google Secret Manager (least privilege)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-database-url
                  key: latest
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-jwt-secret-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-gemini-api-key
                  key: latest

          # Probes for zero-downtime rolling updates
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
