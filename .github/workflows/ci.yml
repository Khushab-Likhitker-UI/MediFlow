name: Sentinel CI & Security Smoke Test

on:
  push:
    branches: [ main, feat/sentinel-deployment ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Test Suite
        env:
          DEBUG: "false"
          JWT_SECRET_KEY: "ci-test-secure-key-minimum-32-characters-long"
        run: |
          python -m pytest backend/tests -v

      - name: Verify No Secrets in Tracked Files
        run: |
          echo "Scanning for accidental hardcoded credentials..."
          ! grep -rn "podedwtxajduajsjqzar" backend/ database/
